name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI builds and tests, it never writes to the repository.
# Every action is pinned by commit, with its version beside it; dependabot keeps the pins current.
# dtolnay/rust-toolchain has no releases, so its pin is a commit of its master branch, moved by hand.
permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Runs on main are never
# cancelled, so every commit there keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: "stable"
          components: rustfmt

      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: "stable"
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy

      - run: cargo clippy --tests -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: audit

      - run: cargo install cargo-audit --locked

      # No --ignore flags, and it should stay that way. An advisory that looks pinned by a
      # dependency is usually held back by this crate's own `rust-version` instead: the
      # MSRV-aware resolver will not take a fixed release that needs a newer Rust than the one
      # claimed here. Raise the MSRV, do not ignore.
      - run: cargo audit

  # The pinned ruff version and rule set (ruff.toml) keep a linter upgrade from turning CI red on a
  # day nobody touched the Python. scripts/ is the directory `make lint-python` covers.
  python-lint:
    name: ruff (scripts/) + third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.16.4
          args: check
          src: scripts

      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.16.4
          args: format --check
          src: scripts

      # THIRD-PARTY-NOTICES.md ships beside every binary and LICENSE-COMMERCIAL points at it, so a
      # dependency change has to reach it; generated from Cargo.lock, so checked against it.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about

      - name: Third-party notices are in sync with Cargo.lock
        run: make check-third-party-notices

      # The Nix recipe and the Compose snippet repeat Cargo.toml's version by hand.
      - name: Every file names Cargo.toml's version
        run: make check-versions

  # Cargo.toml's `rust-version` is a promise to `cargo install` users on an older toolchain, and
  # only a build on exactly that toolchain keeps it: a dependency bump can raise the real floor
  # without any line of this crate changing. The version appears twice below on purpose - the
  # action's input cannot read Cargo.toml - and the first step fails if it drifts from it.
  msrv:
    name: cargo check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The toolchain below is Cargo.toml's rust-version
        run: grep -q '^rust-version = "1.90"$' Cargo.toml

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: "1.90"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - run: cargo check --locked

  # `cargo publish --dry-run` without the upload: packages the crate from `include` and builds it
  # from its own tarball, so a file the allow-list dropped fails here rather than at publish time,
  # which cannot be undone.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package

      - run: cargo package --locked

  build-and-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10-01
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest

      - name: Build
        run: cargo build --locked

      # Includes tests/: the real binary under `script`, `openssl` and `curl`, and nginx in a
      # rootless podman container - all of which ubuntu-latest has.
      - name: Test
        run: cargo nextest run --locked
