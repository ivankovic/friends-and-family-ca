version: 2
updates:
  # Rust dependencies (Cargo.toml/Cargo.lock). This crate signs certificates and faces the
  # internet, so security patches in its dependency tree matter more than usual.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # The actions the workflows use, pinned by commit with the version in a comment beside it:
  # dependabot moves both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # It has no releases: its branches name Rust toolchains, and the workflows pin a commit of
      # master and pass the toolchain as an input. Dependabot would offer those branches as
      # versions. Move its pin by hand.
      - dependency-name: "dtolnay/rust-toolchain"

  # The base of the image packaging/docker/Dockerfile builds in, pinned by digest.
  # Dockerfile.release starts from scratch and has nothing to update.
  - package-ecosystem: "docker"
    directory: "/packaging/docker"
    schedule:
      interval: "weekly"
