version: 2
updates:
  # Rust dependencies (Cargo.toml/Cargo.lock). This crate signs certificates and faces the
  # internet, so security patches in its dependency tree matter more than usual.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # The actions used by .github/workflows/ci.yml (actions/checkout, dtolnay/rust-toolchain,
  # Swatinem/rust-cache, ...).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
