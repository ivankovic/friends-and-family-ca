# cargo-nextest's settings for this repository.

# The tests that start nginx in a container (tests/nginx.rs). Rootless podman serialises container
# creation through one database, and eight at once time out waiting for it ("database is locked");
# two at a time keeps the suite's wall-clock and avoids that.
[test-groups]
containers = { max-threads = 2 }

[[profile.default.overrides]]
filter = "binary(nginx)"
test-group = "containers"
