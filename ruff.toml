# Linting for every Python file in the repository (scripts/), run by `make lint-python`, the
# pre-push hook, and CI's python-lint job.
#
# `select` is pinned explicitly rather than left on ruff's defaults, which move between releases:
# an unpinned set means a ruff upgrade can turn CI red on a day nobody touched Python. What is
# listed is ruff's own default core (E4/E7/E9 + pyflakes) plus:
#
#   I        import order, so a diff of a script is about its logic, not its imports
#   UP       syntax that `target-version` below makes available
#   C4       needless generators/comprehensions
#   ISC      implicit string concatenation, which silently glues two list elements into one
#   EXE      a shebang and the executable bit have to agree
#
# The two pylint rules are named individually, not as the `PL` family, for the same
# version-stability reason: `PLR` in particular grows new opinions (magic values, argument counts)
# that would fail on a ruff upgrade without a line of Python changing.
target-version = "py312"
# 100, not ruff's default 88: the width the Rust half of the repository uses (rustfmt's default).
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "ISC", "EXE", "PLR0402", "PLW1510"]
