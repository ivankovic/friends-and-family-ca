# The enrollment page, as a service for a docker-compose.yml that already runs nginx. Copy it under
# `services:` and adjust the three marked lines - see packaging/README.md.
  ffca:
    # A released image - or, before there is one, the build from a checkout below.
    #image: ghcr.io/ivankovic/friends-and-family-ca:0.1.0
    build:
      context: /home/marko/src/friends-and-family-ca      # <- your checkout
      dockerfile: packaging/docker/Dockerfile
    image: friends-and-family-ca
    container_name: ffca                                   # nginx reaches it as http://ffca:8080
    init: true                                             # stops at once when told to: the
                                                           # page is the container's first process
    mem_limit: 128m
    pids_limit: 64                                         # its threads: a fixed few
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"                                    # <- "Page runs as" on the Nginx tab
    volumes:
      - /var/lib/ffca/invites:/invites                     # <- the CA's invites folder; nothing else
    healthcheck:
      test: ["CMD", "/ffca", "healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - gateway                                            # a network only nginx shares with it:
                                                           # anything else on it could reach the
                                                           # page directly, not through nginx
