[package]
name = "friends-and-family-ca"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A small certificate authority for mutual-TLS client certificates: a terminal UI to run it, and a web page where family and friends collect theirs"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ivankovic/friends-and-family-ca"
readme = "README.md"
keywords = ["mtls", "tls", "certificate", "pki", "tui"]
categories = ["command-line-utilities", "cryptography", "network-programming"]
# An allow-list, so nothing in the checkout reaches crates.io by accident.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSE-COMMERCIAL",
    "/THIRD-PARTY-NOTICES.md",
    "/README.md",
    "/src/**/*.rs",
]

# `cargo binstall friends-and-family-ca`: the static binaries release.yml attaches to a release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ffca-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "ffca"

[dependencies]
anyhow = "1.0.100"
base64 = "0.23"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29.0"
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.4"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.2"
rcgen = { version = "0.14", features = ["x509-parser"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tiny_http = "0.12"
toml = "1"
x509-parser = "0.18"

[[bin]]
name = "ffca"
path = "src/main.rs"

[dev-dependencies]
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", features = ["ring"] }
tempfile = "3"
vt100 = "0.16.2"

# Dependencies optimized even in debug builds: key generation and signing in an unoptimized `ring`
# make every test that issues a certificate several times slower, and nobody steps through them.
[profile.dev.package."*"]
opt-level = 2
